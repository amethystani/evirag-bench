name: Audit

on:
  push:
    paths: ['Cargo.toml', 'Cargo.lock']
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
