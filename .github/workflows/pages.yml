name: Pages

on:
  push:
    branches: [main]
    paths: ['docs/site/**', 'docs/assets/**', 'paper/paper.pdf', 'examples/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp docs/site/index.html _site/
          cp examples/smoke_run.json _site/demo.json
          cp docs/assets/*.jpg docs/assets/*.png _site/assets/
          cp paper/paper.pdf _site/paper.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
