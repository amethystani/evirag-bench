<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="A white beam of evidence enters a glass prism and fans out into a spectrum of distinct views">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d14"/><stop offset="1" stop-color="#151226"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#9fb4ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="900" height="320" rx="18" fill="url(#bg)"/>
  <rect width="900" height="320" rx="18" fill="url(#grid)"/>
  <!-- incoming beam: one question, all the evidence -->
  <g filter="url(#glow)">
    <line x1="40" y1="190" x2="396" y2="146" stroke="url(#beam)" stroke-width="7" stroke-linecap="round"/>
    <line x1="40" y1="190" x2="396" y2="146" stroke="#fff" stroke-width="2" stroke-dasharray="6 14" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- beam inside the glass -->
  <line x1="396" y1="146" x2="495" y2="130" stroke="#fff" stroke-opacity="0.75" stroke-width="3"/>
  <!-- dispersed spectrum: one view per colour -->
  <g filter="url(#glow)">
    <line x1="495" y1="130" x2="880" y2="70" stroke="#ff3b5c" stroke-width="5" stroke-linecap="round" opacity="0.9" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.20s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="70;80;62;70" dur="5.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
    </line>
  </g>
  <g filter="url(#glow)">
    <line x1="495" y1="130" x2="880" y2="102" stroke="#ff8a3d" stroke-width="5" stroke-linecap="round" opacity="0.9" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.27s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="102;112;94;102" dur="5.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="2.7s" repeatCount="indefinite"/>
    </line>
  </g>
  <g filter="url(#glow)">
    <line x1="495" y1="130" x2="880" y2="134" stroke="#ffd93d" stroke-width="5" stroke-linecap="round" opacity="0.9" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.34s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="134;144;126;134" dur="5.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.0s" repeatCount="indefinite"/>
    </line>
  </g>
  <g filter="url(#glow)">
    <line x1="495" y1="130" x2="880" y2="166" stroke="#4be07a" stroke-width="5" stroke-linecap="round" opacity="0.9" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.41s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="166;176;158;166" dur="6.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.3s" repeatCount="indefinite"/>
    </line>
  </g>
  <g filter="url(#glow)">
    <line x1="495" y1="130" x2="880" y2="198" stroke="#3dc9ff" stroke-width="5" stroke-linecap="round" opacity="0.9" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.48s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="198;208;190;198" dur="6.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.6s" repeatCount="indefinite"/>
    </line>
  </g>
  <g filter="url(#glow)">
    <line x1="495" y1="130" x2="880" y2="230" stroke="#5b6bff" stroke-width="5" stroke-linecap="round" opacity="0.9" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.55s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="230;240;222;230" dur="7.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="3.9s" repeatCount="indefinite"/>
    </line>
  </g>
  <g filter="url(#glow)">
    <line x1="495" y1="130" x2="880" y2="262" stroke="#b455ff" stroke-width="5" stroke-linecap="round" opacity="0.9" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.62s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="262;272;254;262" dur="7.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4.2s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- prism -->
  <polygon points="450,50 360,210 540,210" fill="url(#glass)" stroke="#dfe6ff" stroke-opacity="0.8" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </polygon>
  <polyline points="450,50 420,104 480,104" fill="none" stroke="#fff" stroke-opacity="0.18"/>
  <text x="40" y="226" fill="#aab2d5" font-family="ui-monospace,Menlo,monospace" font-size="13">question + corpus</text>
  <text x="878" y="300" text-anchor="end" fill="#aab2d5" font-family="ui-monospace,Menlo,monospace" font-size="13">distinct, source-linked views</text>
  <text x="450" y="245" text-anchor="middle" fill="#ffffff" font-family="ui-monospace,Menlo,monospace" font-size="15" font-weight="700" letter-spacing="4">EVIRAG</text>
</svg>
